plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
}

repositories {
    maven {
        name 'Cloth Config'
        url 'https://maven.shedaniel.me'
        content {
            includeGroup 'me.shedaniel.cloth'
        }
    }
    maven {
        name 'Accessories'
        url 'https://maven.wispforest.io/releases'
    }
    maven {
        name 'FFAPI for Accessories'
        url 'https://maven.su5ed.dev/releases'
    }
    maven {
        name 'JEI, Immersive Engineering'
        url 'https://maven.blamejared.com'
        content {
            includeGroup 'mezz.jei'
        }
    }
    maven {
        name = 'Curios'
        url = 'https://maven.theillusivec4.top/'
        content {
            includeGroup 'top.theillusivec4.curios'
        }
    }
    flatDir {
        name 'Warium, Valkyrien Warium'
        dir 'libs'
    }
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${mc_version}-${forge_version}"

    api fg.deobf("me.shedaniel.cloth:cloth-config-forge:11.1.136")
    
    compileOnly fg.deobf("blank:Warium-${warium_version}:${warium_version}")

    annotationProcessor "org.spongepowered:mixin:0.8.5:processor"

    compileOnly fg.deobf("mezz.jei:jei-${mc_version}-common-api:${jei_version}")

    implementation fg.deobf("com.github.glitchfiend:TerraBlender-forge:${mc_version}-3.0.1.10")

    compileOnly fg.deobf("io.wispforest:accessories-neoforge:1.0.0-beta.47+${mc_version}")
    compileOnly fg.deobf("io.wispforest:accessories-common:1.0.0-beta.47+${mc_version}-mojmap")

    compileOnly fg.deobf("dev.su5ed.sinytra.fabric-api:fabric-api-base:0.4.31+ef105b4977"){
        exclude group: "dev.su5ed.sinytra.fabric-api"
    }

    compileOnly "top.theillusivec4.curios:curios-forge:5.14.1+1.20.1"

    compileOnly fg.deobf("curse.maven:oculus-581495:6020952")
}

mixin {
    add sourceSets.main, "${mod_id}.mixins.refmap.json"
    config "${mod_id}.mixins.json"
}

tasks.named('processResources', ProcessResources).configure {
    exclude '**/*.psd'
    
    var replaceProperties = [
        mc_version          : mc_version,
        forge_version       : forge_version,
        loader_version_range: loader_version_range,
        mod_group_id        : mod_group_id,
        mod_id              : mod_id,
        mod_name            : mod_name,
        mod_license         : mod_license,
        mod_version         : mod_version,
        mod_authors         : mod_authors,
        credits             : credits,
        mod_description     : mod_description,
        warium_version      : warium_version,
        jei_version         : jei_version
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta', mod_id + '.mixins.json']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += "-Xlint:-removal"
}